name: GoReleaser

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Setup Go (for GoReleaser)
        uses: actions/setup-go@v5
        with:
          go-version: stable

      # Asset generation step - must complete before GoReleaser
      - name: Generate bundled assets
        run: |
          cd cli
          bun install
          bun run build:release

      # Restore lockfile to prevent goreleaser dirty state error
      # bun install may modify bun.lock due to platform differences
      - name: Restore lockfile
        run: git checkout cli/bun.lock

      - name: Verify asset generation
        run: |
          if [ ! -f cli/src/assets/embedded.ts ]; then
            echo "Error: embedded.ts not generated"
            exit 1
          fi

          # Check that IS_BUNDLED is true (not the placeholder)
          if grep -q "IS_BUNDLED = false" cli/src/assets/embedded.ts; then
            echo "Error: embedded.ts is placeholder (IS_BUNDLED = false)"
            exit 1
          fi

          echo "Asset manifest generated successfully"
          echo "First 30 lines:"
          head -30 cli/src/assets/embedded.ts

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      - name: Verify Release Artifacts
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXPECTED_ARTIFACTS=(
            "rp1-darwin-arm64"
            "rp1-darwin-amd64"
            "rp1-linux-arm64"
            "rp1-linux-amd64"
            "rp1-windows-amd64.zip"
            "checksums.txt"
          )

          TAG="${{ github.ref_name }}"
          echo "Verifying artifacts for release: $TAG"

          ASSETS=$(gh release view "$TAG" --json assets -q ".assets[].name" 2>/dev/null || echo "")

          if [ -z "$ASSETS" ]; then
            echo "Warning: Could not fetch release assets. Release may still be processing."
            exit 0
          fi

          MISSING=0
          for artifact in "${EXPECTED_ARTIFACTS[@]}"; do
            if echo "$ASSETS" | grep -q "^${artifact}$"; then
              echo "Found: $artifact"
            else
              echo "Missing: $artifact"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "Error: $MISSING expected artifact(s) missing from release"
            exit 1
          fi

          echo "All expected artifacts present"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: dist/
          retention-days: 7

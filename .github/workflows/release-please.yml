# Release Please - Versioning & Changelog Automation
#
# Rolling Release PR Strategy:
# - One open release PR always exists, accumulating changes
# - Every merged PR updates the release PR (changelog, version bump)
# - NO release happens until the release PR itself is merged
# - Merging the release PR triggers: tag creation, GitHub release, artifact builds
#
# This workflow handles:
# - Semantic versioning via conventional commits
# - Changelog generation
# - Release PR creation and maintenance
# - OpenCode artifact builds (only on actual release)
#
# Binary distribution (rp1 CLI) is handled separately by goreleaser.yml,
# which triggers on the tag created by this workflow.
#
# Note: CI checks (lint, typecheck, tests) run in ci.yml workflow.
# Use branch protection rules to require CI to pass before merging.

name: Release Please

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-opencode-artifacts:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('cli/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Build OpenCode artifacts
        run: |
          cd cli
          bun install
          bun run build
          bun run build:opencode

      - name: Create release tarball
        run: |
          VERSION=${{ needs.release-please.outputs.version }}
          mkdir -p release-artifacts

          tar -czvf release-artifacts/rp1-opencode-${VERSION}.tar.gz -C cli/dist opencode

          cat > release-artifacts/manifest.json << EOF
          {
            "version": "${VERSION}",
            "created": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sha": "${{ github.sha }}"
          }
          EOF

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} \
            release-artifacts/rp1-opencode-*.tar.gz \
            release-artifacts/manifest.json \
            --clobber

  deploy-docs:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Cloudflare Pages deployment
        run: |
          curl -X POST "${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}"
          echo "Triggered Cloudflare Pages deployment for release ${{ needs.release-please.outputs.tag_name }}"

  lighthouse:
    needs: [release-please, deploy-docs]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Wait for Cloudflare Pages deploy
        uses: WalshyDev/cf-pages-await@3abae9f62a7672a1701300702ce42908e16cb88a  # v1
        id: cf-pages
        with:
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          apiToken: ${{ secrets.CF_API_TOKEN }}
          project: rp1
          commitHash: ${{ github.sha }}

      - name: Run Lighthouse CI
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        run: |
          lhci autorun --config=lighthouserc.json \
            --collect.url=${{ steps.cf-pages.outputs.url }} \
            --collect.url=${{ steps.cf-pages.outputs.url }}/getting-started/installation/ \
            --collect.url=${{ steps.cf-pages.outputs.url }}/reference/ \
            --collect.url=${{ steps.cf-pages.outputs.url }}/guides/feature-development/

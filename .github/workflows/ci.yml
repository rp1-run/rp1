name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - uses: extractions/setup-just@v2

      - name: Install CLI dependencies
        run: cd cli && bun install

      - name: Install native app dependencies
        run: cd native-app && bun install --frozen-lockfile

      - name: Run checks
        run: just check-cli && just check-native-app

  docs:
    name: Docs Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      - name: Build docs (strict — fails on broken internal links and anchors)
        run: mkdocs build --strict

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_ISOLATION_IMAGE: rp1-cli-test-isolation:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - uses: extractions/setup-just@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('cli/bun.lock', 'native-app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install native app dependencies
        run: cd native-app && bun install

      - name: Build disposable CLI test boundary
        run: docker build --file .github/test-isolation.Dockerfile --tag "$TEST_ISOLATION_IMAGE" .

      - name: Verify protected-home filesystem boundary
        id: test_home_boundary
        shell: bash
        run: |
          container_id=$(docker create "$TEST_ISOLATION_IMAGE" bun run scripts/verify-test-home-boundary.ts)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          mount_count=$(docker inspect --format '{{ len .Mounts }}' "$container_id")
          if [[ "$mount_count" != "0" ]]; then
            echo "Refusing to test with host or volume mounts" >&2
            docker inspect --format '{{ json .Mounts }}' "$container_id" >&2
            exit 1
          fi
          echo "Container mounts: none"
          docker start --attach "$container_id"

      - name: Run CLI tests inside disposable boundary
        run: docker run --rm "$TEST_ISOLATION_IMAGE" bun run test

      - name: Run native app tests
        run: just test-native-app

      - name: Generate coverage report
        if: ${{ always() && !cancelled() && steps.test_home_boundary.outcome == 'success' }}
        shell: bash
        run: |
          container_id=$(docker create "$TEST_ISOLATION_IMAGE" bash -o pipefail -c 'bun run test:coverage 2>&1 | tee coverage.txt')
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          if docker start --attach "$container_id"; then
            exit_code=0
          else
            exit_code=$?
          fi
          docker cp "$container_id:/workspace/cli/coverage.txt" cli/coverage.txt || true
          exit "$exit_code"

      - name: Upload coverage report
        if: ${{ always() && !cancelled() && steps.test_home_boundary.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cli/coverage.txt

  catalog:
    name: Verify Catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - uses: extractions/setup-just@v2

      - name: Install dependencies
        run: cd cli && bun install --ignore-scripts

      - name: Verify catalogue is up to date
        run: just catalog-check

  plugins:
    name: Build Plugins (all platforms)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - uses: extractions/setup-just@v2

      - name: Install dependencies
        run: cd cli && bun install

      - name: Build plugins on all platforms
        run: just build-plugins-check

  attestation:
    name: Verify Attestations
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Skip non-release PRs
        if: ${{ github.event_name != 'pull_request' || github.head_ref != 'release-please--branches--main' }}
        run: echo "Skipping attestation verification; evals only block the release-please PR."

      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main' }}

      # Pin Node 24 rather than .tool-versions (node 26): the `cd cli && bun install`
      # step below builds web-ui's promptfoo -> better-sqlite3, which ships no prebuilt
      # binary for Node 26 and fails to compile from source. Node 24 has prebuilts.
      # Follow-up: migrate web-ui's promptfoo to the libsql build (as evals already did)
      # to drop better-sqlite3, then this can return to node-version-file: .tool-versions.
      - uses: actions/setup-node@v4
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main' }}
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main' }}
        with:
          bun-version: "1.3.5"

      - uses: extractions/setup-just@v2
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main' }}

      - name: Install CLI dependencies
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main' }}
        run: cd cli && bun install

      - name: Build platform artifacts
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main' }}
        run: just build-claude-code

      - name: Install eval dependencies
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main' }}
        run: cd evals && bun install

      - name: Verify attestations
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main' }}
        run: just eval-verify

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - uses: extractions/setup-just@v2

      - name: Install CLI dependencies
        run: cd cli && bun install

      - name: Install native app dependencies
        run: cd native-app && bun install

      - name: Run checks
        run: just check-cli && just check-native-app

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - uses: extractions/setup-just@v2

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('cli/bun.lock', 'native-app/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install CLI dependencies
        run: cd cli && bun install

      - name: Install native app dependencies
        run: cd native-app && bun install

      - name: Run tests
        run: just test-cli && just test-native-app

      - name: Generate coverage report
        if: always()
        run: cd cli && bun test --coverage 2>&1 | tee coverage.txt || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: cli/coverage.txt

  catalog:
    name: Verify Catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - uses: extractions/setup-just@v2

      - name: Install dependencies
        run: cd cli && bun install --ignore-scripts

      - name: Verify catalogue is up to date
        run: just catalog-check

  plugins:
    name: Build Plugins (all platforms)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - uses: extractions/setup-just@v2

      - name: Install dependencies
        run: cd cli && bun install

      - name: Build plugins on all platforms
        run: just build-plugins-check

  attestation:
    name: Verify Attestations
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - uses: extractions/setup-just@v2

      - name: Install CLI dependencies
        run: cd cli && bun install

      - name: Build platform artifacts
        run: just build-claude-code

      - name: Install eval dependencies
        run: cd evals && bun install

      - name: Verify attestations
        run: just eval-verify

# Lefthook git hooks configuration
# https://github.com/evilmartians/lefthook
#
# Install: brew install lefthook && lefthook install
# Or: npm install -g @evilmartians/lefthook && lefthook install
pre-commit:
  parallel: true
  commands:
    lint:
      glob: "cli/**/*.{ts,tsx,js,jsx}"
      run: cd cli && bun run lint
    format:
      glob: "cli/**/*.{ts,tsx,js,jsx}"
      run: cd cli && bun run format
    plugin-dist:
      glob: "plugins/**/*.{md,json,yaml,yml,py}"
      run: just check-plugin-dist
    catalog:
      glob: "plugins/**/*.md"
      run: just check-catalog
pre-push:
  parallel: true
  commands:
    typecheck-cli:
      run: cd cli && bun run typecheck
    typecheck-webui:
      run: cd cli/web-ui && npx tsc --noEmit
    plugin-dist:
      run: just check-plugin-dist
    catalog:
      run: just check-catalog
      fail_text: "Catalogue is stale — run: just generate-catalog"
    verify-evals:
      run: "just verify-evals || echo 'WARNING: Unattested prompt changes detected. Run: just run-evals <suite> && just attest-evals <output-file>'"
      fail_text: "Advisory: Some prompts need re-attestation"
    no-artifactory:
      run: just check-no-artifactory
      fail_text: "Lockfiles contain internal Artifactory references — see output above for details"

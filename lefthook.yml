# Lefthook git hooks configuration
# https://github.com/evilmartians/lefthook
#
# Install: brew install lefthook && lefthook install
# Or: npm install -g @evilmartians/lefthook && lefthook install
pre-commit:
  parallel: true
  commands:
    protect-main:
      run: .lefthook/pre-commit/protect-main.sh
      fail_text: "Direct commits to main/master are blocked"
    lint:
      glob: "cli/**/*.{ts,tsx,js,jsx}"
      run: cd cli && bun run lint
    format:
      glob: "cli/**/*.{ts,tsx,js,jsx}"
      run: cd cli && bun run format
    catalog:
      glob: "plugins/**/*.md"
      run: "just catalog-check || echo 'WARNING: Catalogue is stale. Run: just catalog-generate'"
      fail_text: "Advisory: Catalogue needs regeneration"
pre-push:
  parallel: true
  commands:
    protect-main:
      run: .lefthook/pre-push/protect-main.sh {1} {2}
      use_stdin: true
      fail_text: "Pushes targeting main/master are blocked"
    typecheck-cli:
      run: cd cli && bun run typecheck
    typecheck-webui:
      run: cd cli/web-ui && bun install --frozen-lockfile && bun run typecheck
    catalog:
      run: just catalog-check
      fail_text: "Catalogue is stale — run: just catalog-generate"
    eval-verify:
      run: "just eval-verify || echo 'WARNING: Unattested prompt changes detected. Run: just eval-run <suite> && just eval-attest <output-file>'"
      fail_text: "Advisory: Some prompts need re-attestation"
    no-artifactory:
      run: just check-no-artifactory
      fail_text: "Lockfiles contain internal Artifactory references — see output above for details"

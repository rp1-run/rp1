description: "Evals for build-fast command with task-builder integration"
evaluateOptions:
  maxConcurrency: 4
extensions:
  - file://../../../shared/extension.ts:extensionHook
providers:
  - id: file://../../../../providers/claude-with-tools.ts
    label: rp1-agentic-eval
    config:
      model: claude-opus-4-6
      # Fast mode: 2.5x faster output tokens/sec at premium pricing
      betas:
        - fast-mode-2026-02-01
      # working_dir is set dynamically by extension via WORKSPACE_DIR var
      # This enables parallel test execution with isolated workspaces
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      ask_user_behavior: first_option
      max_turns: 50
      setting_sources:
        - project
        - local
        - user
      plugins:
        - type: local
          path: plugins/dev
        - type: local
          path: plugins/base
      tools:
        - Read
        - Write
        - Edit
        - Glob
        - Grep
        - Bash
        - Skill
prompts:
  - file://prompt.txt
defaultTest:
  options:
    provider:
      id: "anthropic:claude-haiku-4-5-20251001"
      config:
        temperature: 0
  vars:
    DEVELOPMENT_REQUEST: "add a simple bun utility script that validates JSON input from stdin"
    GIT_WORKTREE: false
    GIT_COMMIT: false
    GIT_PUSH: false
    AFK: false
    CONFIRM_PLAN: false
    REVIEW: false
tests:
  - description: "default_behavior"
    assert:
      # Programmatic: tool-call presence checks
      - type: javascript
        value: |
          // Assert work status update via bash
          const meta = context.providerResponse?.metadata;
          const cmds = meta?.bashCommands ?? [];
          const hasWorkUpdate = cmds.some(c => c.includes('rp1 agent-tools work update') && c.includes('--workflow') && c.includes('--run-id'));
          if (!hasWorkUpdate) return { pass: false, score: 0, reason: 'No work status update found in bash commands' };
          return { pass: true, score: 1, reason: 'Work status update found' };
      - type: javascript
        value: |
          // Assert task-builder spawned (subagent tool call)
          const meta = context.providerResponse?.metadata;
          const tcs = meta?.toolCalls ?? [];
          const hasSubagent = tcs.some(tc =>
            ['Task', 'task', 'Agent', 'agent'].includes(tc.name) &&
            JSON.stringify(tc.input).includes('task-builder')
          );
          if (!hasSubagent) return { pass: false, score: 0, reason: 'No task-builder subagent spawn found' };
          return { pass: true, score: 1, reason: 'task-builder spawned' };
      - type: javascript
        value: |
          // Assert artifact registration
          const meta = context.providerResponse?.metadata;
          const cmds = meta?.bashCommands ?? [];
          const hasArtifact = cmds.some(c => c.includes('rp1 agent-tools work artifact') && c.includes('--project') && c.includes('--run-id') && c.includes('--path'));
          if (!hasArtifact) return { pass: false, score: 0, reason: 'No artifact registration found in bash commands' };
          return { pass: true, score: 1, reason: 'Artifact registration found' };
      - type: javascript
        value: |
          // Assert PROHIBITED commands not present
          const meta = context.providerResponse?.metadata;
          const cmds = meta?.bashCommands ?? [];
          const prohibited = [
            { pattern: /\bgit\s+init\b/, label: 'git init' },
            { pattern: /\bgit\s+rebase\b/, label: 'git rebase' },
            { pattern: /\bgit\s+reset\s+--hard\b/, label: 'git reset --hard' },
            { pattern: /\bgit\s+push\b/, label: 'git push' },
            { pattern: /\bgit\b.*\bcommit\b/, label: 'git commit' },
          ];
          for (const { pattern, label } of prohibited) {
            const found = cmds.find(c => pattern.test(c));
            if (found) return { pass: false, score: 0, reason: `Prohibited command found: ${label}` };
          }
          return { pass: true, score: 1, reason: 'No prohibited commands found' };
      # LLM-rubric: behavioral/output checks only
      - type: llm-rubric
        value: |
          Evaluate the agent's output text for behavioral correctness.

          REQUIRED (all must pass):
          1. Output contains "Scope" section with scope classification (Small, Medium, or Large)
          2. Output contains reasoning about files affected, systems involved, risk level, and estimated effort
          3. For Small/Medium scope: Output contains "Build Fast Complete" section with request summary
          4. For Small/Medium scope: Output contains "Quality" section (or similarly worded) showing format/lint/test status
          5. Output indicates changes are uncommitted in working directory

          EDGE CASES:
          - When AFK=true: Auto-decisions should be logged with "(AFK auto)" prefix in summary
          - When GIT_PUSH=true: Metadata bashCommands should contain "git push -u origin"
          - When KB files missing: Agent should warn but continue (not block)
  - description: "large_scope_redirect"
    vars:
      DEVELOPMENT_REQUEST: "rewrite the entire authentication system from scratch, migrate to a new database schema, and update all API endpoints to use GraphQL instead of REST"
    assert:
      # Programmatic: no implementation tool calls for large scope
      - type: javascript
        value: |
          // Assert no Write/Edit tool calls (no implementation for large scope)
          const meta = context.providerResponse?.metadata;
          const tcs = meta?.toolCalls ?? [];
          const writeEdit = tcs.find(tc => ['write', 'edit'].includes(tc.name.toLowerCase()));
          if (writeEdit) return { pass: false, score: 0, reason: `Found ${writeEdit.name} tool call — agent should not implement large scope` };
          return { pass: true, score: 1, reason: 'No Write/Edit tool calls found' };
      - type: javascript
        value: |
          // Assert no git commit
          const meta = context.providerResponse?.metadata;
          const cmds = meta?.bashCommands ?? [];
          const hasCommit = cmds.some(c => /\bgit\b.*\bcommit\b/.test(c));
          if (hasCommit) return { pass: false, score: 0, reason: 'Found git commit for large scope request' };
          return { pass: true, score: 1, reason: 'No git commit found' };
      - type: javascript
        value: |
          // Assert no artifact registration for large scope
          const meta = context.providerResponse?.metadata;
          const cmds = meta?.bashCommands ?? [];
          const hasArtifact = cmds.some(c => c.includes('rp1 agent-tools work artifact'));
          if (hasArtifact) return { pass: false, score: 0, reason: 'Found artifact registration for large scope request' };
          return { pass: true, score: 1, reason: 'No artifact registration found' };
      # LLM-rubric: behavioral checks
      - type: llm-rubric
        value: |
          Evaluate whether the agent correctly identifies and redirects a large-scope request.

          REQUIRED (all must pass):
          1. Output contains "Scope Assessment" section with "Large" classification
          2. Output contains "REQUEST EXCEEDS SCOPE" or similar redirect notice
          3. Output explains why this needs the full /build workflow
          4. Output provides options: reduce scope, phase it, or use /build command
          5. Output suggests a "Recommended Quick Win" or minimal viable alternative
          6. Agent reports status as "completed" with redirect message via work status update

          PASS if: Agent stops after redirect, provides actionable alternatives
          FAIL if: Agent attempts to implement the large-scope request
  - description: "confirm_plan_and_review_flags"
    vars:
      DEVELOPMENT_REQUEST: "add a simple greeting utility function"
      GIT_WORKTREE: false
      GIT_COMMIT: true
      GIT_PUSH: false
      AFK: false
      CONFIRM_PLAN: true
      REVIEW: true
    assert:
      # Programmatic: checkpoint and delegation tool calls
      - type: javascript
        value: |
          // Assert AskUserQuestion fired for plan review checkpoint
          const meta = context.providerResponse?.metadata;
          const tcs = meta?.toolCalls ?? [];
          const askCalls = tcs.filter(tc => tc.name === 'AskUserQuestion');
          const hasPlanReview = askCalls.some(tc => {
            const input = JSON.stringify(tc.input);
            return input.includes('Continue') && (input.includes('Revise') || input.includes('Stop'));
          });
          if (!hasPlanReview) return { pass: false, score: 0, reason: 'No plan review checkpoint (AskUserQuestion with Continue/Revise/Stop)' };
          return { pass: true, score: 1, reason: 'Plan review checkpoint fired' };
      - type: javascript
        value: |
          // Assert task-builder spawned
          const meta = context.providerResponse?.metadata;
          const tcs = meta?.toolCalls ?? [];
          const hasSubagent = tcs.some(tc =>
            ['Task', 'task', 'Agent', 'agent'].includes(tc.name) &&
            JSON.stringify(tc.input).includes('task-builder')
          );
          if (!hasSubagent) return { pass: false, score: 0, reason: 'No task-builder subagent spawn found' };
          return { pass: true, score: 1, reason: 'task-builder spawned' };
      - type: javascript
        value: |
          // Assert task-reviewer spawned (--review flag)
          const meta = context.providerResponse?.metadata;
          const tcs = meta?.toolCalls ?? [];
          const hasReviewer = tcs.some(tc =>
            ['Task', 'task', 'Agent', 'agent'].includes(tc.name) &&
            JSON.stringify(tc.input).includes('task-reviewer')
          );
          if (!hasReviewer) return { pass: false, score: 0, reason: 'No task-reviewer subagent spawn found' };
          return { pass: true, score: 1, reason: 'task-reviewer spawned' };
      - type: javascript
        value: |
          // Assert post-implementation checkpoint (AskUserQuestion with Done/Add/Edit)
          const meta = context.providerResponse?.metadata;
          const tcs = meta?.toolCalls ?? [];
          const askCalls = tcs.filter(tc => tc.name === 'AskUserQuestion');
          const hasPostImpl = askCalls.some(tc => {
            const input = JSON.stringify(tc.input);
            return input.includes('Done') && input.includes('Add');
          });
          if (!hasPostImpl) return { pass: false, score: 0, reason: 'No post-implementation checkpoint (AskUserQuestion with Done/Add)' };
          return { pass: true, score: 1, reason: 'Post-implementation checkpoint fired' };
      - type: javascript
        value: |
          // Assert artifact registration
          const meta = context.providerResponse?.metadata;
          const cmds = meta?.bashCommands ?? [];
          const hasArtifact = cmds.some(c => c.includes('rp1 agent-tools work artifact') && c.includes('--project') && c.includes('--run-id') && c.includes('--path'));
          if (!hasArtifact) return { pass: false, score: 0, reason: 'No artifact registration found' };
          return { pass: true, score: 1, reason: 'Artifact registration found' };
      # LLM-rubric: behavioral checks (checkpoint flow and output structure)
      - type: llm-rubric
        value: |
          Evaluate the agent execution with --confirm-plan and --review flags enabled.
          Focus on the checkpoint flow and output quality — NOT artifact path format.

          REQUIRED (all must pass):
          1. Output shows "Review" status (PASSED, SKIPPED, or FAILED+RETRIED)
          2. Output contains "Build Fast Complete" with artifact path
          3. Agent committed changes (Metadata bashCommands contains "git commit")
          4. Agent used conventional commit format (feat:, fix:, refactor:, etc.)

          PASS if: Output has completion summary with review status and commit evidence
          FAIL if: Missing review status, no completion summary, or no commits
  - description: "worktree_commits_and_push"
    vars:
      DEVELOPMENT_REQUEST: "add a simple hello world script"
      GIT_WORKTREE: true
      GIT_COMMIT: true
      GIT_PUSH: true
      AFK: false
      CONFIRM_PLAN: false
      REVIEW: false
    assert:
      # Programmatic: git and worktree tool calls
      - type: javascript
        value: |
          // Assert git commit present
          const meta = context.providerResponse?.metadata;
          const cmds = meta?.bashCommands ?? [];
          const hasCommit = cmds.some(c => /\bgit\b.*\bcommit\b/.test(c));
          if (!hasCommit) return { pass: false, score: 0, reason: 'No git commit found in bash commands' };
          return { pass: true, score: 1, reason: 'git commit found' };
      - type: javascript
        value: |
          // Assert git push present
          const meta = context.providerResponse?.metadata;
          const cmds = meta?.bashCommands ?? [];
          const hasPush = cmds.some(c => /\bgit\b.*\bpush\b/.test(c));
          if (!hasPush) return { pass: false, score: 0, reason: 'No git push found in bash commands' };
          return { pass: true, score: 1, reason: 'git push found' };
      - type: javascript
        value: |
          // Assert worktree create and cleanup
          const meta = context.providerResponse?.metadata;
          const cmds = meta?.bashCommands ?? [];
          const hasCreate = cmds.some(c => c.includes('rp1 agent-tools worktree create'));
          const hasCleanup = cmds.some(c => c.includes('rp1 agent-tools worktree cleanup'));
          if (!hasCreate) return { pass: false, score: 0, reason: 'No worktree create found' };
          if (!hasCleanup) return { pass: false, score: 0, reason: 'No worktree cleanup found' };
          return { pass: true, score: 1, reason: 'Worktree create and cleanup found' };
      - type: javascript
        value: |
          // Assert task-builder spawned
          const meta = context.providerResponse?.metadata;
          const tcs = meta?.toolCalls ?? [];
          const hasSubagent = tcs.some(tc =>
            ['Task', 'task', 'Agent', 'agent'].includes(tc.name) &&
            JSON.stringify(tc.input).includes('task-builder')
          );
          if (!hasSubagent) return { pass: false, score: 0, reason: 'No task-builder subagent spawn found' };
          return { pass: true, score: 1, reason: 'task-builder spawned' };
      - type: javascript
        value: |
          // Assert artifact registration
          const meta = context.providerResponse?.metadata;
          const cmds = meta?.bashCommands ?? [];
          const hasArtifact = cmds.some(c => c.includes('rp1 agent-tools work artifact') && c.includes('--project') && c.includes('--run-id') && c.includes('--path'));
          if (!hasArtifact) return { pass: false, score: 0, reason: 'No artifact registration found' };
          return { pass: true, score: 1, reason: 'Artifact registration found' };
      # LLM-rubric: behavioral checks
      - type: llm-rubric
        value: |
          Evaluate whether the agent respects GIT_COMMIT=true, GIT_WORKTREE=true, and GIT_PUSH=true flags.

          REQUIRED:
          1. Agent implements the requested change (creates/modifies files)
          2. Agent uses conventional commit format (feat:, fix:, refactor:, etc.) in any git commits
          3. Agent creates artifact at {RP1_ROOT}/work/quick-builds/ with date-based filename

          PASS if: Changes made, committed, pushed, used worktree, task-builder invoked, artifact registered
          FAIL if: Missing commits, push, worktree operations, uses build-fast-executor, or missing artifact registration
  - description: "in_afk_mode_bypasses_confirm"
    vars:
      DEVELOPMENT_REQUEST: "add a json validation script that's ultra performant"
      GIT_WORKTREE: false
      GIT_COMMIT: true
      GIT_PUSH: false
      AFK: true
      CONFIRM_PLAN: true
      REVIEW: false
    assert:
      # Programmatic: tool-call checks for AFK mode
      - type: javascript
        value: |
          // Assert git commit present
          const meta = context.providerResponse?.metadata;
          const cmds = meta?.bashCommands ?? [];
          const hasCommit = cmds.some(c => /\bgit\b.*\bcommit\b/.test(c));
          if (!hasCommit) return { pass: false, score: 0, reason: 'No git commit found' };
          return { pass: true, score: 1, reason: 'git commit found' };
      - type: javascript
        value: |
          // Assert NO AskUserQuestion calls (AFK mode bypasses all prompts)
          const meta = context.providerResponse?.metadata;
          const tcs = meta?.toolCalls ?? [];
          const askCall = tcs.find(tc => tc.name === 'AskUserQuestion');
          if (askCall) return { pass: false, score: 0, reason: 'Found AskUserQuestion in AFK mode — should be bypassed' };
          return { pass: true, score: 1, reason: 'No AskUserQuestion calls in AFK mode' };
      - type: javascript
        value: |
          // Assert task-builder spawned
          const meta = context.providerResponse?.metadata;
          const tcs = meta?.toolCalls ?? [];
          const hasSubagent = tcs.some(tc =>
            ['Task', 'task', 'Agent', 'agent'].includes(tc.name) &&
            JSON.stringify(tc.input).includes('task-builder')
          );
          if (!hasSubagent) return { pass: false, score: 0, reason: 'No task-builder subagent spawn found' };
          return { pass: true, score: 1, reason: 'task-builder spawned' };
      - type: javascript
        value: |
          // Assert artifact registration
          const meta = context.providerResponse?.metadata;
          const cmds = meta?.bashCommands ?? [];
          const hasArtifact = cmds.some(c => c.includes('rp1 agent-tools work artifact') && c.includes('--project') && c.includes('--run-id') && c.includes('--path'));
          if (!hasArtifact) return { pass: false, score: 0, reason: 'No artifact registration found' };
          return { pass: true, score: 1, reason: 'Artifact registration found' };
      # LLM-rubric: behavioral checks
      - type: llm-rubric
        value: |
          Evaluate whether AFK=true bypasses --confirm-plan checkpoints.

          REQUIRED:
          1. Agent implements the requested change (creates/modifies files)
          2. Agent uses conventional commit format (feat:, fix:, refactor:, etc.) in any git commits
          3. Agent creates artifact at {RP1_ROOT}/work/quick-builds/ with date-based filename
          4. No plan review or post-implementation checkpoints fire

          PASS if: Changes made, committed, no user prompts despite --confirm-plan flag, artifact registered
          FAIL if: Agent waits for user input

description: "Evals for build-fast command via OpenCode with task-builder integration"
evaluateOptions:
  maxConcurrency: 1
extensions:
  - file://../../../shared/extension.ts:extensionHook
providers:
  - id: file://../../../../providers/opencode-with-tools.ts
    label: rp1-opencode-eval
    config:
      # Provider and model resolved from env vars (OPENCODE_PROVIDER_ID, OPENCODE_MODEL_ID)
      # to avoid leaking model names in config. Falls back to defaults if unset.
      # working_dir is set dynamically by extension via WORKSPACE_DIR var
      # maxConcurrency: 1 because OpenCode server is per-test
      permission:
        "*": allow
prompts:
  - file://prompt.txt
defaultTest:
  options:
    provider:
      id: "anthropic:claude-haiku-4-5-20251001"
      config:
        temperature: 0
  vars:
    DEVELOPMENT_REQUEST: "add a simple bun utility script that validates JSON input from stdin"
    GIT_WORKTREE: false
    GIT_COMMIT: false
    GIT_PUSH: false
    AFK: false
    CONFIRM_PLAN: false
    REVIEW: false
tests:
  - description: "default_behavior"
    assert:
      - type: llm-rubric
        value: |
          Evaluate the agent execution. Check the output text AND the Metadata JSON section.

          NOTE: Tool names may be lowercase (e.g., "read", "bash", "write", "task") or PascalCase
          (e.g., "Read", "Bash", "Write") depending on the provider. Match case-insensitively.

          REQUIRED (all must pass):
          1. Agent produces a scope classification (Small, Medium, or Large) somewhere in the output text
          2. Output contains reasoning about files affected and estimated effort
          3. Agent loads KB files (partial loading is fine) - Metadata toolCalls shows read/Read calls to files in .rp1/context/ directory
          4. For Small/Medium scope: Agent creates artifact at .rp1/work/quick-builds/ with date-based filename pattern ({yyyy-mm-dd}-{slug}-{n}.md) - visible in toolCalls as write/bash/edit to that path
          5. For Small/Medium scope: Output contains summary with quality status (format/lint/test results)
          6. For Small/Medium scope: Agent delegates to a builder subagent for implementation - Metadata toolCalls shows a "task" call with prompt referencing build-fast or task-builder

          PROHIBITED (fail if any present in Metadata bashCommands):
          - "git init" (creates orphan repo, corrupts history)
          - "git rebase" (rewrites commit history)
          - "git reset --hard" (permanently discards commits)
          - "git push"
          - "git commit"

          PASS if: KB loaded, scope assessed, artifact created, implementation delegated, quality reported
          FAIL if: Any REQUIRED criteria not met or PROHIBITED commands found
  - description: "large_scope_redirect"
    vars:
      DEVELOPMENT_REQUEST: "rewrite the entire authentication system from scratch, migrate to a new database schema, and update all API endpoints to use GraphQL instead of REST"
    assert:
      - type: llm-rubric
        value: |
          Evaluate whether the agent correctly identifies and redirects a large-scope request.
          Check the output text AND the Metadata JSON section.

          NOTE: Tool names may be lowercase or PascalCase depending on the provider. Match case-insensitively.

          REQUIRED (all must pass):
          1. Agent classifies the request as "Large" scope or equivalent (too complex for quick build)
          2. Output communicates that this request exceeds the quick-build scope
          3. Output suggests alternatives: reduce scope, phase it, or use a larger workflow
          4. Agent does NOT create substantial source code files - Metadata toolCalls should not show write/edit calls creating auth, database, or GraphQL files

          PASS if: Agent shows restraint, classifies as large, provides alternatives
          FAIL if: Agent implements the entire large-scope request
  - description: "confirm_plan_and_review_flags"
    vars:
      DEVELOPMENT_REQUEST: "add a simple greeting utility function"
      GIT_WORKTREE: false
      GIT_COMMIT: true
      GIT_PUSH: false
      AFK: false
      CONFIRM_PLAN: true
      REVIEW: true
    assert:
      - type: llm-rubric
        value: |
          Evaluate the agent execution with --confirm-plan and --review flags enabled.
          Check the output text AND the Metadata JSON section.

          NOTE: Tool names may be lowercase or PascalCase depending on the provider. Match case-insensitively.
          User interaction (checkpoints) may appear as AskUserQuestion tool calls OR be handled
          through a separate question/permission API not visible in toolCalls. Judge by workflow
          progression, not by specific tool names.

          REQUIRED (all must pass):
          1. Agent spawns a planner that writes artifact to .rp1/work/quick-builds/ with date-based filename
          2. Workflow progresses through planning → implementation → review phases (evidenced by
             multiple "task" calls in toolCalls dispatching to planner, builder, and reviewer/test-runner subagents)
          3. Agent spawns a builder subagent (toolCalls shows "task" with prompt referencing task-builder or implementation)
          4. Agent spawns a reviewer or test-runner subagent after builder completes (due to --review flag) -
             toolCalls shows "task" with prompt referencing reviewer, verifier, or test-runner
          5. Output shows review/verification results (PASSED, verified, or test results)
          6. Artifact at .rp1/work/quick-builds/ contains both implementation and verification sections
          7. Metadata bashCommands contains "git commit" (GIT_COMMIT=true)
          8. Output contains completion summary with artifact path

          PASS if: Full plan→build→review pipeline executed, artifact complete, committed
          FAIL if: Missing review phase, no reviewer/test-runner invocation, or incomplete artifact
  - description: "worktree_commits_and_push"
    vars:
      DEVELOPMENT_REQUEST: "add a simple hello world script"
      GIT_WORKTREE: true
      GIT_COMMIT: true
      GIT_PUSH: true
      AFK: false
      CONFIRM_PLAN: false
      REVIEW: false
    assert:
      - type: llm-rubric
        value: |
          Evaluate whether the agent respects GIT_COMMIT=true, GIT_WORKTREE=true, and GIT_PUSH=true flags.
          Check the Metadata JSON section for bashCommands and toolCalls.

          NOTE: Tool names may be lowercase or PascalCase depending on the provider.

          REQUIRED:
          1. Agent implements the requested change (toolCalls shows write/edit calls creating source files)
          2. Metadata bashCommands contains "git commit" with a message
          3. Metadata bashCommands contains "git push"
          4. Agent uses conventional commit format (feat:, fix:, refactor:, etc.)
          5. Agent creates artifact at .rp1/work/quick-builds/ with date-based filename
          6. Agent delegates to a builder subagent (toolCalls shows "task" call)

          PASS if: Changes made, committed, pushed, builder invoked
          FAIL if: Missing commits or push
  - description: "in_afk_mode_bypasses_confirm"
    vars:
      DEVELOPMENT_REQUEST: "add a json validation script that's ultra performant"
      GIT_WORKTREE: false
      GIT_COMMIT: true
      GIT_PUSH: false
      AFK: true
      CONFIRM_PLAN: true
      REVIEW: false
    assert:
      - type: llm-rubric
        value: |
          Evaluate whether AFK=true bypasses --confirm-plan checkpoints.
          Check the Metadata JSON section for bashCommands and toolCalls.

          NOTE: Tool names may be lowercase or PascalCase depending on the provider.
          User interaction may appear as AskUserQuestion tool calls OR be handled through a
          separate API. In AFK mode, NO user interaction should occur regardless of mechanism.

          REQUIRED:
          1. Agent implements the requested change (toolCalls shows write/edit calls creating source files)
          2. Metadata bashCommands contains "git commit"
          3. Agent uses conventional commit format (feat:, fix:, refactor:, etc.)
          4. Agent delegates to a builder subagent (toolCalls shows "task" call)
          5. Agent creates artifact at .rp1/work/quick-builds/ with date-based filename

          PROHIBITED:
          - No user-facing prompts or checkpoints should fire despite --confirm-plan being set
            (AFK overrides). If AskUserQuestion appears in toolCalls, that's a FAIL.
          - The workflow should proceed autonomously from start to finish

          PASS if: Changes made, committed, no user interaction despite --confirm-plan flag
          FAIL if: Agent blocks on user input or shows interactive checkpoints

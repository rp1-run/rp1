# create-prompt Orchestrator Evaluation Suite
#
# Regression eval for /rp1-base:create-prompt pipeline.
# Validates:
#   - orchestrator spawns prompt-pipeline-runner at top level (not nested)
#   - all three mandatory artifacts (SKILL.md, evals.yaml, confidence-report.md)
#     are registered via `rp1 agent-tools emit` AND written to disk
#   - SKILL.md covers every applicable governance primitive for the AGENT_TYPE
#     profile and carries the fallibilist overlay
#   - evals.yaml matches the documented contract (inline providers,
#     `file://./SKILL.md` sibling prompt path)
#   - confidence-report.md names an epistemic stance, embeds the 5-level
#     confidence vocabulary, and scores every one of the six pipeline stages
#
# Grading is deterministic: every assertion reads generated-file contents
# from `{WORKSPACE_DIR}/{PROMPT_NAME}/` and checks structural patterns.
# There are no llm-rubric assertions -- promptfoo does not auto-load file
# contents into rubric prompts, so rubric-based content grading was a
# false positive in earlier revisions.
#
# Run: just eval-run rp1-base/create-prompt
description: "rp1-base:create-prompt pipeline evaluation"
evaluateOptions:
  maxConcurrency: 2
extensions:
  - file://../../shared/extension.ts:extensionHook
providers:
  - id: anthropic:claude-agent-sdk
    label: rp1-agentic-eval
    config:
      model: haiku
      betas:
        - fast-mode-2026-02-01
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      ask_user_question:
        behavior: first_option
      max_turns: 100
      setting_sources:
        - project
        - local
        - user
      plugins:
        - type: local
          path: ../../../../dist/claude-code/base
      custom_allowed_tools:
        - Read
        - Write
        - Edit
        - Glob
        - Grep
        - Bash
        - AskUserQuestion
        - Skill
prompts:
  - file://prompt.txt
defaultTest:
  options:
    provider:
      id: "anthropic:claude-haiku-4-5-20251001"
      config:
        temperature: 0
  vars:
    PROMPT_NAME: "test-agent"
    DESCRIPTION: "A leaf-worker agent that validates YAML configuration files and reports structural errors with line numbers"
    AGENT_TYPE: "leaf-worker"
    AFK: true
tests:
  # ─────────────────────────────────────────────────────────────────────
  # Test 1: Default pipeline execution with leaf-worker profile
  # ─────────────────────────────────────────────────────────────────────
  - description: "default_leaf_worker_pipeline"
    threshold: 1.0
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertOrchestratorSpawnedPipelineRunner
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertWorkStatusUpdate
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptThreeArtifacts
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptFilesOnDisk
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertNoAskUser
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptConstitutional
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptStructural
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptEpistemic

  # ─────────────────────────────────────────────────────────────────────
  # Test 2: Orchestrator profile -- constitutional filter must include
  # orchestrator purity + transition guards AND must NOT add primitives
  # outside the orchestrator applicable set
  # ─────────────────────────────────────────────────────────────────────
  - description: "orchestrator_profile_governance"
    vars:
      PROMPT_NAME: "test-orchestrator"
      DESCRIPTION: "An orchestrator agent that coordinates a multi-step code review pipeline by dispatching reviewer sub-agents and aggregating their findings"
      AGENT_TYPE: "orchestrator"
    threshold: 1.0
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertOrchestratorSpawnedPipelineRunner
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertWorkStatusUpdate
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptThreeArtifacts
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptFilesOnDisk
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptConstitutional
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptStructural
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptEpistemic

  # ─────────────────────────────────────────────────────────────────────
  # Test 3: kb-investigator profile on vague input -- confirms pipeline
  # completes with minimal DESCRIPTION and stage-6 does NOT demand scope
  # limits (kb-investigator profile omits them by design)
  # ─────────────────────────────────────────────────────────────────────
  - description: "kb_investigator_vague_description"
    vars:
      PROMPT_NAME: "test-kb-investigator"
      DESCRIPTION: "A knowledge-base investigator that surfaces relevant prior decisions"
      AGENT_TYPE: "kb-investigator"
    threshold: 1.0
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertOrchestratorSpawnedPipelineRunner
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertWorkStatusUpdate
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptThreeArtifacts
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptFilesOnDisk
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptConstitutional
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptStructural
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptEpistemic

  # ─────────────────────────────────────────────────────────────────────
  # Test 4a: COMPLEXITY=auto on a clearly-simple DESCRIPTION. The runner's
  # Stage 0.5 classifier must detect the "validator" + "wrapper" + "single-pass"
  # keywords and pick `simple`. Epistemic assertion parses the effective
  # complexity out of the report.
  # ─────────────────────────────────────────────────────────────────────
  - description: "auto_classifier_detects_simple"
    vars:
      PROMPT_NAME: "test-auto-simple"
      DESCRIPTION: "A leaf-worker validator wrapper that scans a markdown file for mermaid code blocks and reports errors in a single-pass, read-only way"
      AGENT_TYPE: "leaf-worker"
      COMPLEXITY: "auto"
    threshold: 1.0
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertOrchestratorSpawnedPipelineRunner
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptThreeArtifacts
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptFilesOnDisk
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptConstitutional
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptStructural
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptEpistemic

  # ─────────────────────────────────────────────────────────────────────
  # Test 4: COMPLEXITY=simple -- Stage 4 (popper-patterns) is skipped and
  # Stage 5 emits the 3-level trim. Epistemic assertion reads COMPLEXITY
  # from vars and adjusts its required level list.
  # ─────────────────────────────────────────────────────────────────────
  - description: "simple_complexity_trim"
    vars:
      PROMPT_NAME: "test-simple-wrapper"
      DESCRIPTION: "A leaf-worker skill that wraps rp1 agent-tools mmd-validate to check mermaid blocks in a markdown file"
      AGENT_TYPE: "leaf-worker"
      COMPLEXITY: "simple"
    threshold: 1.0
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertOrchestratorSpawnedPipelineRunner
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptThreeArtifacts
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptFilesOnDisk
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptConstitutional
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptStructural
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptEpistemic

  # ─────────────────────────────────────────────────────────────────────
  # Test 5: PLUGIN=rp1-base -- files must land under
  # {WORKSPACE_DIR}/plugins/base/skills/{PROMPT_NAME}/, and registration
  # paths must match (assertCreatePromptFilesOnDisk honors PLUGIN).
  # ─────────────────────────────────────────────────────────────────────
  - description: "plugin_direct_write_rp1_base"
    vars:
      PROMPT_NAME: "test-direct-writer"
      DESCRIPTION: "A leaf-worker skill that validates YAML configuration files and reports structural errors"
      AGENT_TYPE: "leaf-worker"
      PLUGIN: "rp1-base"
    threshold: 1.0
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertOrchestratorSpawnedPipelineRunner
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptThreeArtifacts
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptFilesOnDisk
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptConstitutional
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptStructural
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertCreatePromptEpistemic

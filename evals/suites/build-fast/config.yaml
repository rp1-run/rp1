# build-fast-executor Instruction-Following Evaluation
#
# Tests that the build-fast agent correctly handles the --git-commit flag:
# - Commits when --git-commit=true
# - Does NOT commit when --git-commit=false
#
# Run: promptfoo eval -c suites/build-fast/config.yaml

description: "build-fast-executor instruction-following evaluation"

extensions:
  - file://extension.ts:extensionHook

providers:
  - id: anthropic:claude-agent-sdk
    label: rp1-agentic-eval
    config:
      model: claude-opus-4-5
      working_dir: /tmp/rp1-eval-workspace
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      max_turns: 50
      setting_sources:
        - user
        - project
        - local
      tools:
        - Read
        - Write
        - Edit
        - Glob
        - Grep
        - Bash
        - Skill

prompts:
  - file://prompts/main.txt

tests:
  - description: "Commits when --git-commit=true"
    vars:
      REQUEST: "Add a hello world function to src/index.ts"
      GIT_COMMIT: "true"
      GIT_WORKTREE: "false"
      GIT_PUSH: "false"
      AFK_MODE: "true"
    assert:
      - type: javascript
        value: file://assertions/git-commit.ts:assertCommitMade

  - description: "Does NOT commit when --git-commit=false"
    vars:
      REQUEST: "Add a hello world function to src/index.ts"
      GIT_COMMIT: "false"
      GIT_WORKTREE: "false"
      GIT_PUSH: "false"
      AFK_MODE: "true"
    assert:
      - type: javascript
        value: file://assertions/git-commit.ts:assertNoCommitMade

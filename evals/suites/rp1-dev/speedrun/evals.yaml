# speedrun Command Evaluation Suite
#
# Advisory eval for /rp1-dev:speedrun.
# Validates: scope gating, delegation to general sub-agent, post-build prompt flow.
#
# Run: just eval-run rp1-dev/speedrun
description: "rp1-dev:speedrun advisory evaluation"
evaluateOptions:
  maxConcurrency: 4
extensions:
  - file://../../shared/extension.ts:extensionHook
providers:
  - id: anthropic:claude-agent-sdk
    label: rp1-agentic-eval
    config:
      model: claude-haiku-4-5
      betas:
        - fast-mode-2026-02-01
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      ask_user_question:
        behavior: first_option
      max_turns: 30
      setting_sources:
        - project
        - local
        - user
      plugins:
        - type: local
          path: ../../../../dist/claude-code/dev
        - type: local
          path: ../../../../dist/claude-code/base
      custom_allowed_tools:
        - Read
        - Write
        - Edit
        - Glob
        - Grep
        - Bash
        - Skill
prompts:
  - file://prompt.txt
defaultTest:
  options:
    provider:
      id: "anthropic:claude-haiku-4-5-20251001"
      config:
        temperature: 0
  vars:
    REQUEST: "add a simple hello world script at src/hello.ts"
tests:
  - description: "small_request_delegates_to_subagent"
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertSpeedrunBuilderSpawned
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertOrchestratorSpawnedSpeedrunBuilder
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertNoBuildFastAgents
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertWorkStatusUpdate
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertArtifactRegistration
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertPostBuildPromptOptions
      - type: llm-rubric
        value: |
          Evaluate the agent's output after completing a small build request.
          Note: post-build prompt options and task delegation are verified separately
          by deterministic assertions — do NOT evaluate those here.

          REQUIRED (all must pass):
          1. Output is concise, well-formatted, and free of confusion
          2. Output does not contain error messages or stack traces
          3. Agent completed the task (created the requested file) or clearly indicates next steps

          PASS if: Output is clean and coherent
          FAIL if: Output contains errors, is garbled, or is incoherent
  - description: "medium_scope_redirects"
    vars:
      REQUEST: "refactor the entire authentication module to use OAuth2, update all API routes, and migrate the session store from Redis to PostgreSQL"
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertNoWriteEdit
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertNoImplSubagentSpawned
      - type: llm-rubric
        value: |
          Evaluate the qualitative aspects of the agent's scope classification and redirect for a medium/large-scope request.

          REQUIRED (all must pass):
          1. Agent identifies the request as medium or large scope with clear reasoning
          2. Output recommends using `/rp1-dev:build-fast` or `/rp1-dev:build` instead
          3. Output explains WHY the request exceeds speedrun scope (e.g., multiple systems, high risk, many files)
          4. Agent still presents options to continue (new task or exit)
          5. Redirect explanation is helpful and actionable

          PASS if: Scope reasoning is clear and redirect is helpful with actionable alternatives
          FAIL if: Scope reasoning is absent, vague, or redirect lacks helpful guidance
  - description: "post_build_prompt_has_commit_option"
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertPostBuildPromptOptions

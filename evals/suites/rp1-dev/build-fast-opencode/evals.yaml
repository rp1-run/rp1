description: "Evals for build-fast command via OpenCode with task-builder integration"
evaluateOptions:
  maxConcurrency: 1
extensions:
  - file://../../shared/extension.ts:extensionHook
providers:
  - id: file://../../../providers/opencode-with-tools.ts
    label: rp1-opencode-eval
    config:
      # Provider and model resolved from env vars (OPENCODE_PROVIDER_ID, OPENCODE_MODEL_ID)
      # to avoid leaking model names in config. Falls back to defaults if unset.
      # working_dir is set dynamically by extension via WORKSPACE_DIR var
      # maxConcurrency: 1 because OpenCode server is per-test
      permission:
        "*": allow
prompts:
  - file://prompt.txt
defaultTest:
  options:
    provider:
      id: "anthropic:claude-haiku-4-5-20251001"
      config:
        temperature: 0
  vars:
    DEVELOPMENT_REQUEST: "add a simple bun utility script that validates JSON input from stdin"
    GIT_WORKTREE: false
    GIT_COMMIT: false
    GIT_PUSH: false
    AFK: false
    CONFIRM_PLAN: false
    REVIEW: false
tests:
  - description: "default_behavior"
    assert:
      - type: llm-rubric
        value: |
          Evaluate the agent execution. Check the output text AND the Metadata JSON section.

          REQUIRED (all must pass):
          1. Output contains "Scope" section with scope classification (Small, Medium, or Large)
          2. Output contains reasoning about files affected, systems involved, risk level, and estimated effort
          3. Agent reports work status updates via Metadata bashCommands containing "rp1 agent-tools work update" with "--workflow build-fast" and "--run-id" flags (reads state.mmd for valid transitions, no --metadata hack)
          4. Agent loads KB files (partial loading is fine) - Metadata bashCommands or toolCalls shows reading from {RP1_ROOT}/context/ directory
          5. For Small/Medium scope: Output contains "Build Fast Complete" section with request summary
          6. For Small/Medium scope: Agent creates artifact at {RP1_ROOT}/work/quick-builds/ with date-based filename pattern ({yyyy-mm-dd}-{slug}-{n}.md)
          7. For Small/Medium scope: Output contains "Quality" section (or similarly worded) showing format/lint/test status
          8. Output indicates changes are uncommitted in working directory
          9. For Small/Medium scope: Agent spawns task-builder (NOT build-fast-executor) for implementation

          PROHIBITED (fail if any present in Metadata bashCommands):
          - "git init" (creates orphan repo, corrupts history)
          - "git rebase" (rewrites commit history)
          - "git reset --hard" (permanently discards commits)
          - "git push"
          - "git commit"

          EDGE CASES:
          - When AFK=true: Auto-decisions should be logged with "(AFK auto)" prefix in summary
          - When GIT_PUSH=true: Metadata bashCommands should contain "git push -u origin"
          - When KB files missing: Agent should warn but continue (not block)
  - description: "large_scope_redirect"
    vars:
      DEVELOPMENT_REQUEST: "rewrite the entire authentication system from scratch, migrate to a new database schema, and update all API endpoints to use GraphQL instead of REST"
    assert:
      - type: llm-rubric
        value: |
          Evaluate whether the agent correctly identifies and redirects a large-scope request.

          Check the output text AND the Metadata JSON section.

          REQUIRED (all must pass):
          1. Output contains "Scope Assessment" section with "Large" classification
          2. Output contains "REQUEST EXCEEDS SCOPE" or similar redirect notice
          3. Output explains why this needs the full /build workflow
          4. Output provides options: reduce scope, phase it, or use /build command
          5. Output suggests a "Recommended Quick Win" or minimal viable alternative
          6. Agent reports status as "completed" with redirect message via work status update

          PROHIBITED:
          - Agent should NOT proceed to implementation phase for large scope
          - No source code files should be created or modified (check Metadata toolCalls for Write/Edit)
          - No git commits should be created for the request itself

          PASS if: Agent stops after redirect, provides actionable alternatives
          FAIL if: Agent attempts to implement the large-scope request
  - description: "confirm_plan_and_review_flags"
    vars:
      DEVELOPMENT_REQUEST: "add a simple greeting utility function"
      GIT_WORKTREE: false
      GIT_COMMIT: true
      GIT_PUSH: false
      AFK: false
      CONFIRM_PLAN: true
      REVIEW: true
    assert:
      - type: llm-rubric
        value: |
          Evaluate the agent execution with --confirm-plan and --review flags enabled.
          Check the output text AND the Metadata JSON section.

          REQUIRED (all must pass):
          1. Agent spawns build-fast-planner which writes artifact to {RP1_ROOT}/work/quick-builds/{yyyy-mm-dd}-{slug}-{n}.md
          2. Plan review checkpoint fires: Metadata toolCalls contains AskUserQuestion with options including "Continue", "Revise", "Stop"
          3. Post-implementation checkpoint fires: Metadata toolCalls contains AskUserQuestion with options including "Done", "Add/Edit"
          4. Agent spawns task-builder with QUICK_BUILD_PATH parameter pointing to the artifact
          5. Task IDs passed to task-builder as comma-separated list (e.g., "T1,T2" or "T1,T2,T3") in single invocation
          6. Agent spawns task-reviewer after task-builder completes (due to --review flag)
          7. Output shows "Review" status (PASSED, SKIPPED, or FAILED+RETRIED)
          8. Artifact file exists at {RP1_ROOT}/work/quick-builds/ directory with correct structure:
             - Contains "## Plan" section with reasoning and files affected
             - Contains "## Tasks" section with task list in format "- [ ] **T{N}**: description [complexity:X]"
             - Contains "## Implementation Summary" section (added by task-builder)
             - Contains "## Verification" section (added by task-reviewer)
          9. Output contains "Build Fast Complete" with artifact path

          PASS if: Both checkpoints fire, reviewer invoked, artifact structure correct
          FAIL if: Missing checkpoints, no reviewer invocation, or incorrect artifact structure
  - description: "worktree_commits_and_push"
    vars:
      DEVELOPMENT_REQUEST: "add a simple hello world script"
      GIT_WORKTREE: true
      GIT_COMMIT: true
      GIT_PUSH: true
      AFK: false
      CONFIRM_PLAN: false
      REVIEW: false
    assert:
      - type: llm-rubric
        value: |
          Evaluate whether the agent respects GIT_COMMIT=true, GIT_WORKTREE=true, and GIT_PUSH=true flags.

          Check the Metadata JSON section for bashCommands and toolCalls.

          REQUIRED:
          1. Agent implements the requested change (creates/modifies files)
          2. Metadata bashCommands contains "git commit"
          3. Metadata bashCommands contains "git push"
          4. Agent uses conventional commit format (feat:, fix:, refactor:, etc.) in any git commits
          5. Metadata bashCommands contains "rp1 agent-tools worktree create"
          6. Metadata bashCommands contains "rp1 agent-tools worktree cleanup"
          7. Agent spawns task-builder (NOT build-fast-executor) for implementation
          8. Agent creates artifact at {RP1_ROOT}/work/quick-builds/ with date-based filename

          PASS if: Changes made, committed, pushed, used worktree, task-builder invoked
          FAIL if: Missing commits, push, worktree operations, or uses build-fast-executor
  - description: "in_afk_mode_bypasses_confirm"
    vars:
      DEVELOPMENT_REQUEST: "add a json validation script that's ultra performant"
      GIT_WORKTREE: false
      GIT_COMMIT: true
      GIT_PUSH: false
      AFK: true
      CONFIRM_PLAN: true
      REVIEW: false
    assert:
      - type: llm-rubric
        value: |
          Evaluate whether AFK=true bypasses --confirm-plan checkpoints.

          Check the Metadata JSON section for bashCommands and toolCalls.

          REQUIRED:
          1. Agent implements the requested change (creates/modifies files)
          2. Metadata bashCommands contains "git commit"
          3. Agent uses conventional commit format (feat:, fix:, refactor:, etc.) in any git commits
          4. Agent spawns task-builder (NOT build-fast-executor) for implementation
          5. Agent creates artifact at {RP1_ROOT}/work/quick-builds/ with date-based filename

          PROHIBITED:
          - Agent should NOT use AskUserQuestion tool despite --confirm-plan being set (AFK overrides)
          - No plan review checkpoint
          - No post-implementation checkpoint

          PASS if: Changes made, committed, no user prompts despite --confirm-plan flag
          FAIL if: Agent waits for user input or AskUserQuestion appears in toolCalls

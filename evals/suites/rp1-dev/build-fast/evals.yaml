# build-fast Command Evaluation Suite
#
# Tests the /rp1-dev:build-fast command behavior
#
# Run: just evals-suite rp1-dev/build-fast
description: "rp1-dev:build-fast instruction-following evaluation"
tracing:
  enabled: true
extensions:
  - file://../../shared/extension.ts:extensionHook
providers:
  - id: file://../../../providers/claude-with-tools.ts
    label: rp1-agentic-eval
    config:
      model: claude-opus-4-5
      working_dir: /tmp/rp1-eval-workspace
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      max_turns: 50
      setting_sources:
        - project
        - local
        - user
      tools:
        - Read
        - Write
        - Edit
        - Glob
        - Grep
        - Bash
        - Skill
prompts:
  - file://prompt.txt
defaultTest:
  options:
    provider:
      id: "anthropic:claude-haiku-4-5-20251001"
      config:
        temperature: 0
  vars:
    REQUEST: "add a simple bun script that validates JSON input from stdin"
    GIT_WORKTREE: true
    GIT_COMMIT: true
    GIT_PUSH: false
    AFK_MODE: true
tests:
  # === Default behavior (GIT_WORKTREE=true, GIT_COMMIT=true) ===
  - description: "default_flags_behavior"
    assert:
      - type: llm-rubric
        value: |
          Evaluate the build-fast agent execution. Check the output text AND the Metadata JSON section.

          REQUIRED (all must pass):
          1. Output contains a scope assessment with classification as Small, Medium, or Large
          2. Output contains "Build Fast Complete" or similar completion message
          3. Output contains a Changes section listing what was modified
          4. Output contains a Quality section (format/lint/test status)
          5. Output contains branch information (e.g., "**Branch**:" or similar)
          6. Metadata toolCalls includes a Bash call with "rp1 agent-tools worktree create" command
          7. Metadata toolCalls includes a Bash call with "git commit" command
          8. The git commit message uses conventional commit format (feat|fix|refactor|docs|test|chore|style|perf)
          9. Output references a summary artifact path like work/quick-builds/{timestamp}/summary.md

          PROHIBITED (fail if any present in Metadata bashCommands):
          - "git push --force" or "git push -f"
          - "git init" (creates orphan repo in worktree)
          - "git reset --hard"
  # === GIT_COMMIT=false ===
  - description: "no_commit_when_flag_disabled"
    vars:
      GIT_COMMIT: false
    assert:
      - type: llm-rubric
        value: |
          Evaluate whether the agent respected the GIT_COMMIT=false flag.

          Check the Metadata JSON section for toolCalls and bashCommands.

          REQUIRED:
          - Agent should NOT have made any git commit

          PASS if: No "git commit" appears in any Bash tool call commands
          FAIL if: Any Bash command contains "git commit"
  # === Large scope redirect ===
  - description: "large_scope_redirects_to_build"
    vars:
      REQUEST: "completely rewrite the entire authentication system, add OAuth2, SAML, and implement multi-tenancy across all 50+ services"
    assert:
      - type: llm-rubric
        value: |
          Evaluate whether the agent correctly identified the request as too large for build-fast.

          REQUIRED (all must pass):
          1. Agent recognized this as a Large scope request
          2. Output contains messaging about the request exceeding scope (e.g., "EXCEEDS SCOPE", "too large", "out of scope")
          3. Agent recommends using /build or the full build workflow instead
          4. Agent did NOT attempt to implement the changes (no "Build Fast Complete" message)

          The agent should redirect to the full /build workflow, not attempt implementation.

# ============================================================
# EXTRACTION NOTES
# ============================================================
# Source: build-fast.md + build-fast-executor.md + work-status + worktree-workflow
# Generated: 2026-01-23
#
# Rubric sections generated:
#   - REQUIRED: 10 items
#   - PROHIBITED: 5 items
#   - EDGE CASES: 4 items
#
# Assertion types:
#   - [llm-rubric] default_behavior: core workflow verification
#   - [llm-rubric] large_scope_redirect: scope gating verification
#   - [llm-rubric] no_commit_flags_disabled: flag behavior verification
#
# Skipped (redundant/trivial):
#   - "read index.md" - intermediate KB loading step
#   - "cd worktree_path" - internal navigation
#   - "git add -A" - subsumed by commit verification
# ============================================================
description: "Evals for build-fast command and executor agent"
tracing:
  enabled: true
  otlp:
    http:
      enabled: true
evaluateOptions:
  maxConcurrency: 4
extensions:
  - file://../../shared/extension.ts:extensionHook
providers:
  - id: file://../../../providers/claude-with-tools.ts
    label: rp1-agentic-eval
    config:
      model: claude-opus-4-5
      # working_dir is set dynamically by extension via WORKSPACE_DIR var
      # This enables parallel test execution with isolated workspaces
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      ask_user_question:
        behavior: first_option
      max_turns: 50
      setting_sources:
        - project
        - local
        - user
      tools:
        - Read
        - Write
        - Edit
        - Glob
        - Grep
        - Bash
        - Skill
prompts:
  - file://prompt.txt
defaultTest:
  vars:
    REQUEST: "add a simple bun utility script that validates JSON input from stdin"
    GIT_WORKTREE: false
    GIT_COMMIT: false
    GIT_PUSH: false
    AFK_MODE: false
tests:
  - description: "default_behavior"
    assert:
      - type: llm-rubric
        value: |
          Evaluate the agent execution. Check the output text AND the Metadata JSON section.

          REQUIRED (all must pass):
          1. Output contains "Scope" section with scope classification (Small, Medium, or Large)
          2. Output contains reasoning about files affected, systems involved, risk level, and estimated effort
          3. Agent reports work status updates via Metadata bashCommands containing "rp1 agent-tools work update"
          4. Agent loads KB files (partial loading is fine) - Metadata bashCommands or toolCalls shows reading from {RP1_ROOT}/context/ directory
          5. For Small/Medium scope: Output contains "Build Fast Complete" section with request summary
          6. For Small/Medium scope: Agent creates summary artifact at {RP1_ROOT}/work/quick-builds/{task-id}/summary.md
          7. For Small/Medium scope: Output contains "Quality" section (or similarly worded) showing format/lint/test status
          8. Output indicates changes are uncommitted in working directory

          PROHIBITED (fail if any present in Metadata bashCommands):
          - "git init" (creates orphan repo, corrupts history)
          - "git rebase" (rewrites commit history)
          - "git reset --hard" (permanently discards commits)
          - "git push"
          - "git commit"

          EDGE CASES:
          - When AFK_MODE=true: Auto-decisions should be logged with "(AFK auto)" prefix in summary
          - When GIT_PUSH=true: Metadata bashCommands should contain "git push -u origin"
          - When KB files missing: Agent should warn but continue (not block)

# build-fast Command Evaluation Suite
#
# Unified eval config for /rp1-dev:build-fast across harnesses.
# Default: anthropic:claude-agent-sdk. Override: EVAL_HARNESS=opencode
#
# Run: just eval-run rp1-dev/build-fast
# Run with opencode: just eval-run rp1-dev/build-fast --harness=opencode
description: "rp1-dev:build-fast unified evaluation"
evaluateOptions:
  maxConcurrency: 4
extensions:
  - file://../../shared/extension.ts:extensionHook
providers:
  - id: anthropic:claude-agent-sdk
    label: rp1-agentic-eval
    config:
      model: claude-opus-4-6
      betas:
        - fast-mode-2026-02-01
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      ask_user_question:
        behavior: first_option
      max_turns: 50
      setting_sources:
        - project
        - local
        - user
      plugins:
        - type: local
          path: dist/claude-code/dev
        - type: local
          path: dist/claude-code/base
      custom_allowed_tools:
        - Read
        - Write
        - Edit
        - Glob
        - Grep
        - Bash
        - Skill
prompts:
  - file://prompt.txt
defaultTest:
  options:
    provider:
      id: "anthropic:claude-haiku-4-5-20251001"
      config:
        temperature: 0
  vars:
    DEVELOPMENT_REQUEST: "add a simple bun utility script that validates JSON input from stdin"
    GIT_WORKTREE: false
    GIT_COMMIT: false
    GIT_PUSH: false
    AFK: false
    CONFIRM_PLAN: false
    REVIEW: false
tests:
  - description: "default_behavior"
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertWorkStatusUpdate
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertTaskBuilderSpawned
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertArtifactRegistration
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertDefaultProhibited
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertKBLoad
      - type: llm-rubric
        value: |
          Evaluate the agent's output text for quality and structure.

          REQUIRED (all must pass):
          1. Output contains "Scope" section with scope classification (Small, Medium, or Large)
          2. Output contains reasoning about files affected, systems involved, risk level, and estimated effort
          3. For Small/Medium scope: Output contains "Build Fast Complete" section with request summary
          4. For Small/Medium scope: Output references artifact at .rp1/work/quick-builds/ with date-based filename pattern ({yyyy-mm-dd}-{slug}-{n}.md)
          5. For Small/Medium scope: Output contains "Quality" section (or similarly worded) showing format/lint/test status
          6. Output indicates changes are uncommitted in working directory

          PASS if: Output is well-structured with clear scope reasoning and completion summary
          FAIL if: Missing scope classification, no completion summary, or incoherent output structure
  - description: "large_scope_redirect"
    vars:
      DEVELOPMENT_REQUEST: "rewrite the entire authentication system from scratch, migrate to a new database schema, and update all API endpoints to use GraphQL instead of REST"
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertNoWriteEdit
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertNoGitCommitToolCall
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertNoArtifactRegistration
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertScopeRedirectStatus
      - type: llm-rubric
        value: |
          Evaluate whether the agent correctly identifies and redirects a large-scope request.

          REQUIRED (all must pass):
          1. Output contains scope assessment with "Large" classification
          2. Output contains a redirect notice explaining this exceeds build-fast scope
          3. Output explains why this needs the full /build workflow
          4. Output provides options: reduce scope, phase it, or use /build command
          5. Output suggests a recommended quick win or minimal viable alternative

          PASS if: Agent stops after redirect, provides actionable alternatives
          FAIL if: Agent attempts to implement the large-scope request or provides no alternatives
  - description: "confirm_plan_and_review_flags"
    vars:
      DEVELOPMENT_REQUEST: "add a simple greeting utility function"
      GIT_WORKTREE: false
      GIT_COMMIT: true
      GIT_PUSH: false
      AFK: false
      CONFIRM_PLAN: true
      REVIEW: true
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertAskUserCheckpoint
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertTaskBuilderSpawned
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertTaskReviewerSpawned
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertPostImplCheckpoint
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertArtifactRegistration
      - type: llm-rubric
        value: |
          Evaluate the agent execution with --confirm-plan and --review flags enabled.
          Focus on checkpoint flow quality and output structure.

          REQUIRED (all must pass):
          1. Output shows "Review" status (PASSED, SKIPPED, or FAILED+RETRIED)
          2. Artifact structure is correct with Plan, Tasks, Implementation Summary, and Verification sections
          3. Output contains "Build Fast Complete" with artifact path
          4. Task IDs are passed to task-builder as comma-separated list in a single invocation
          5. Checkpoint options are clearly presented (Continue/Revise/Stop for plan, Done/Add for post-impl)

          PASS if: Checkpoint flow is coherent, reviewer invoked, artifact well-structured
          FAIL if: Incoherent checkpoint flow, poor artifact structure, or missing completion summary
  - description: "in_afk_mode_bypasses_confirm"
    vars:
      DEVELOPMENT_REQUEST: "add a json validation script that's ultra performant"
      GIT_WORKTREE: false
      GIT_COMMIT: true
      GIT_PUSH: false
      AFK: true
      CONFIRM_PLAN: true
      REVIEW: false
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertGitCommitToolCall
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertNoAskUser
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertTaskBuilderSpawned
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertArtifactRegistration
      - type: llm-rubric
        value: |
          Evaluate whether AFK=true correctly bypasses --confirm-plan checkpoints.

          REQUIRED:
          1. Agent implements the requested change (creates/modifies files)
          2. Agent uses conventional commit format (feat:, fix:, refactor:, etc.) in any git commits
          3. Agent creates artifact at .rp1/work/quick-builds/ with date-based filename

          PASS if: Changes made, committed with conventional format, artifact created
          FAIL if: Output indicates waiting for user input or incomplete implementation

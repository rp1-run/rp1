# build-fast Command Evaluation Suite
#
# Tests the /rp1-dev:build-fast command's flag handling behavior
#
# Run: just evals-suite rp1-dev/build-fast

description: "rp1-dev:build-fast instruction-following evaluation"

extensions:
  - file://../../shared/extension.ts:extensionHook

providers:
  - id: anthropic:claude-agent-sdk
    label: rp1-agentic-eval
    config:
      model: claude-opus-4-5
      working_dir: /tmp/rp1-eval-workspace
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      max_turns: 50
      setting_sources:
        - user
        - project
        - local
      tools:
        - Read
        - Write
        - Edit
        - Glob
        - Grep
        - Bash
        - Skill

prompts:
  - file://prompt.txt

scenarios:
  # Scenario: Git commit flag behavior
  - description: "git-commit flag tests"
    config:
      - vars:
          REQUEST: "Add a hello world function to src/index.ts"
          GIT_WORKTREE: "false"
          GIT_PUSH: "false"
          AFK_MODE: "true"
    tests:
      - description: "Commits when --git-commit=true"
        vars:
          GIT_COMMIT: "true"
        assert:
          - type: javascript
            value: file://../../shared/assertions/git.ts:assertCommitMade

      - description: "Does NOT commit when --git-commit=false"
        vars:
          GIT_COMMIT: "false"
        assert:
          - type: javascript
            value: file://../../shared/assertions/git.ts:assertNoCommitMade

description: "Evals for build-fast command"

prompts:
  - file://build-fast-eval-prompt.txt

defaultTest:
  vars:
    REQUEST: "add a simple bun script that validates JSON input from stdin"
    GIT_WORKTREE: true
    GIT_COMMIT: true
    GIT_PUSH: false
    AFK_MODE: false

tests:
  - description: "scope_assessment_included_in_output"
    assert:
      # Assertion 1: Scope assessment performed (built-in)
      # Extracted from: "## Scope Assessment" output format
      # source: plugins/dev/agents/build-fast-executor.md
      - type: contains
        value: "Scope Assessment"

      # Assertion 2: Scope classification present (built-in)
      # Extracted from: "**Scope**: Small | Medium | Large"
      # source: plugins/dev/agents/build-fast-executor.md
      - type: regex
        value: "\\*\\*Scope\\*\\*:\\s*(Small|Medium|Large)"

  - description: "build_completes_successfully_small_medium"
    assert:
      # Assertion 3: Build Fast Complete output (built-in)
      # Extracted from: "## Build Fast Complete" output contract
      # source: plugins/dev/agents/build-fast-executor.md
      - type: contains
        value: "Build Fast Complete"

      # Assertion 4: Changes section present (built-in)
      # Extracted from: "**Changes**:" in output contract
      # source: plugins/dev/agents/build-fast-executor.md
      - type: contains
        value: "**Changes**:"

      # Assertion 5: Quality section present (built-in)
      # Extracted from: "**Quality**: Format OK | Lint OK | Tests"
      # source: plugins/dev/agents/build-fast-executor.md
      - type: regex
        value: "\\*\\*Quality\\*\\*:"

  - description: "worktree_created_when_flag_enabled"
    vars:
      GIT_WORKTREE: true
    assert:
      # Assertion 6: Worktree creation (shared assertion)
      # Extracted from: "rp1 agent-tools worktree create {task_slug}"
      # source: plugins/dev/skills/worktree-workflow/SKILL.md
      # Resolved: assertToolCall('Bash', /rp1\s+agent-tools\s+worktree\s+create/)
      - type: javascript
        value: |
          file://evals/suites/shared/assertions/tool-calls.ts assertToolCall('Bash', /rp1\s+agent-tools\s+worktree\s+create/)

      # Assertion 7: Branch info in output (built-in)
      # Extracted from: "**Branch**: {branch}" in output contract
      # source: plugins/dev/agents/build-fast-executor.md
      - type: contains
        value: "**Branch**:"

  - description: "commits_use_conventional_format"
    vars:
      GIT_COMMIT: true
    assert:
      # Assertion 8: Conventional commit format (built-in)
      # Extracted from: "git commit -m 'type(scope): description'"
      # source: plugins/dev/agents/build-fast-executor.md
      - type: regex
        value: "(feat|fix|refactor|docs|test|chore|style|perf)\\([^)]+\\):"

  - description: "summary_artifact_created"
    assert:
      # Assertion 9: Summary file path referenced (built-in)
      # Extracted from: "{RP1_ROOT}/work/quick-builds/{task-id}/summary.md"
      # source: plugins/dev/agents/build-fast-executor.md
      - type: regex
        value: "work/quick-builds/[0-9]{8}-[0-9]{6}-[a-z-]+/summary\\.md"

      # Assertion 10: Summary artifact content (unresolved - requires custom implementation)
      # Extracted from: "Write Summary" with template
      # source: plugins/dev/agents/build-fast-executor.md
      # TODO: assert_artifact_content: summary.md
      # Criteria: File exists with Header, Request, Summary, Changes sections

  - description: "does_not_use_prohibited_git_operations"
    assert:
      # Assertion 11: No force push (built-in)
      # Extracted from: "git push --force PROHIBITED"
      # source: plugins/dev/skills/worktree-workflow/SKILL.md
      - type: not-contains
        value: "git push --force"

      # Assertion 12: No force push short form (built-in)
      # source: plugins/dev/skills/worktree-workflow/SKILL.md
      - type: not-contains
        value: "git push -f"

      # Assertion 13: No git init in worktree (built-in)
      # Extracted from: "git init PROHIBITED - Creates orphan repo"
      # source: plugins/dev/skills/worktree-workflow/SKILL.md
      - type: not-contains
        value: "git init"

      # Assertion 14: No hard reset (built-in)
      # Extracted from: "git reset --hard PROHIBITED"
      # source: plugins/dev/skills/worktree-workflow/SKILL.md
      - type: not-contains
        value: "git reset --hard"

  - description: "large_scope_redirects_to_build"
    vars:
      REQUEST: "completely rewrite the entire authentication system, add OAuth2, SAML, and implement multi-tenancy across all 50+ services"
    assert:
      # Assertion 15: Large scope redirect message (built-in)
      # Extracted from: "## REQUEST EXCEEDS SCOPE"
      # source: plugins/dev/agents/build-fast-executor.md
      - type: contains
        value: "REQUEST EXCEEDS SCOPE"

      # Assertion 16: Redirect suggests /build (built-in)
      # Extracted from: "Run `/build {feature-id}`"
      # source: plugins/dev/agents/build-fast-executor.md
      - type: contains
        value: "/build"

      # Assertion 17: Does not attempt implementation (built-in)
      # Extracted from: "STOP after redirect. Do NOT attempt implementation"
      # source: plugins/dev/agents/build-fast-executor.md
      - type: not-contains
        value: "Build Fast Complete"

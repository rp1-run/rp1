# build Command Evaluation Suite
#
# Unified eval config for /rp1-dev:build across harnesses.
# Default: anthropic:claude-agent-sdk. Override: EVAL_HARNESS=opencode
#
# Run: just eval-run rp1-dev/build
description: "rp1-dev:build unified evaluation"
evaluateOptions:
  maxConcurrency: 4
extensions:
  - file://../../shared/extension.ts:extensionHook
providers:
  - id: anthropic:claude-agent-sdk
    label: rp1-agentic-eval
    config:
      model: sonnet
      betas:
        - fast-mode-2026-02-01
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      ask_user_question:
        behavior: first_option
      max_turns: 200
      setting_sources:
        - project
        - local
        - user
      plugins:
        - type: local
          path: ../../../../dist/claude-code/dev
        - type: local
          path: ../../../../dist/claude-code/base
      custom_allowed_tools:
        - Read
        - Write
        - Edit
        - Glob
        - Grep
        - Bash
        - AskUserQuestion
        - Skill
prompts:
  - file://prompt.txt
defaultTest:
  options:
    provider:
      id: "anthropic:messages:claude-haiku-4-5"
      config:
        temperature: 0
  vars:
    REQUEST: 'add a slugify(text) string utility: lowercase the text, replace spaces and underscores with single hyphens, drop any character that is not a letter, number, or hyphen, collapse repeated hyphens, and trim leading and trailing hyphens. Examples: "Hello, World!" -> "hello-world", " Foo__Bar " -> "foo-bar", "a---b" -> "a-b"'
    GIT_WORKTREE: false
    GIT_COMMIT: false
    GIT_PUSH: false
    GIT_PR: false
    AFK: true
tests:
  - description: "default_behavior_afk"
    threshold: 0.6
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertRequirementGathererFirst
      - type: javascript
        weight: 0
        value: file://../../shared/assertions/tool-calls.ts:assertTaskBuilderSpawned
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertWorkStatusUpdate
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertArtifactRegistration
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertNoAskUser
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertBuildProhibited
      - type: llm-rubric
        value: |
          Evaluate the agent's final output after completing a full build workflow in AFK mode.
          Note: workflow delegation, status emits, and artifact registration are verified
          by deterministic assertions — do NOT evaluate those here.

          REQUIRED (all must pass):
          1. Output references a Feature ID
          2. Output mentions feature artifacts under .rp1/work/features/ directory
          3. Output is well-structured and free of errors or stack traces
          4. Output indicates the build completed (not stalled or abandoned)

          PASS if: Output is coherent, references feature artifacts, and indicates completion
          FAIL if: Output contains errors, is incoherent, or indicates incomplete/stalled work

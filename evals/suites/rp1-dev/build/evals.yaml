# build Command Evaluation Suite
#
# Unified eval config for /rp1-dev:build across harnesses.
# Default: anthropic:claude-agent-sdk. Override: EVAL_HARNESS=opencode
#
# Run: just eval-run rp1-dev/build
description: "rp1-dev:build unified evaluation"
evaluateOptions:
  maxConcurrency: 4
extensions:
  - file://../../shared/extension.ts:extensionHook
providers:
  - id: anthropic:claude-agent-sdk
    label: rp1-agentic-eval
    config:
      model: claude-haiku-4-5
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      ask_user_question:
        behavior: first_option
      max_turns: 200
      setting_sources:
        - project
        - local
        - user
      plugins:
        - type: local
          path: ../../../../dist/claude-code/dev
        - type: local
          path: ../../../../dist/claude-code/base
      custom_allowed_tools:
        - Read
        - Write
        - Edit
        - Glob
        - Grep
        - Bash
        - Skill
prompts:
  - file://prompt.txt
defaultTest:
  options:
    provider:
      id: "anthropic:claude-haiku-4-5-20251001"
      config:
        temperature: 0
  vars:
    REQUEST: "add a simple yaml validator command without adding new deps"
    GIT_WORKTREE: false
    GIT_COMMIT: false
    GIT_PUSH: false
    GIT_PR: false
    AFK: true
tests:
  - description: "default_behavior_afk"
    threshold: 0.6
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertArtifactDetectorFirst
      - type: javascript
        weight: 0
        value: file://../../shared/assertions/tool-calls.ts:assertTaskBuilderSpawned
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertWorkStatusUpdate
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertArtifactRegistration
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertNoAskUser
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertBuildProhibited
      - type: llm-rubric
        value: |
          Evaluate the agent's output for workflow quality (qualitative aspects only).

          REQUIRED (all must pass):
          1. Workflow steps execute in logical order: Requirements -> Design -> Tasks -> Build -> Verify -> Archive
          2. Step status table is presented clearly using symbols: [ ]=PENDING, [~]=RUNNING, [x]=COMPLETED, [-]=SKIPPED, [!]=FAILED
          3. Feature artifacts are organized under .rp1/work/features/{FEATURE_ID}/ directory structure
          4. Builder-reviewer loop demonstrates iterative refinement with max 2 attempts before escalation
          5. Verification phase coordinates code-checker, feature-verifier, and comment-cleaner
          6. Build-verify-aggregator determines overall_status (VERIFIED/FAILED) and ready_for_merge
          7. Final output includes Feature ID, step status table (1-6), and artifacts created

          PASS if: Workflow ordering is coherent, status table is well-structured, and artifact directory organization is clear
          FAIL if: Steps are out of order, status table is missing or malformed, or artifact structure is disorganized

# build Command Evaluation Suite
#
# Unified eval config for /rp1-dev:build across harnesses.
# Default: claude-with-tools. Override: EVAL_HARNESS=opencode
#
# Run: just run-evals rp1-dev/build
description: "rp1-dev:build unified evaluation"
evaluateOptions:
  maxConcurrency: 4
extensions:
  - file://../../shared/extension.ts:extensionHook
providers:
  - id: file://../../../providers/claude-with-tools.ts
    label: rp1-agentic-eval
    config:
      model: claude-opus-4-6
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      ask_user_behavior: first_option
      max_turns: 200
      setting_sources:
        - project
        - local
        - user
      plugins:
        - type: local
          path: plugins/dev
        - type: local
          path: plugins/base
      tools:
        - Read
        - Write
        - Edit
        - Glob
        - Grep
        - Bash
        - Skill
prompts:
  - file://prompt.txt
defaultTest:
  options:
    provider:
      id: "anthropic:claude-haiku-4-5-20251001"
      config:
        temperature: 0
  vars:
    REQUEST: "add a simple yaml validator command without adding new deps"
    GIT_WORKTREE: false
    GIT_COMMIT: false
    GIT_PUSH: false
    GIT_PR: false
    AFK: true
tests:
  - description: "default_behavior_afk"
    threshold: 0.6
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertArtifactDetectorFirst
      - type: javascript
        weight: 0
        value: file://../../shared/assertions/tool-calls.ts:assertTaskBuilderSpawned
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertWorkStatusUpdate
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertNoAskUser
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertBuildProhibited
      - type: llm-rubric
        value: |
          Evaluate the agent's output text for behavioral correctness.

          REQUIRED (all must pass):
          1. Executes workflow steps in order: Requirements -> Design -> Tasks -> Build -> Verify -> Archive
          2. Outputs step status table
          3. Final output includes Feature ID and artifacts created

          PASS if: Full workflow executes with status tracking
          FAIL if: Steps skipped out of order or no status table
  - description: "git_worktree_workflow"
    threshold: 0.6
    vars:
      GIT_WORKTREE: true
      GIT_COMMIT: true
      GIT_PR: true
      AFK: true
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertWorktreeCreateToolCall
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertGitCommitToolCall
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertGitPushToolCall
      - type: javascript
        value: |
          // Assert PR creation attempted (GIT_PR=true)
          const meta = context.providerResponse?.metadata;
          const cmds = meta?.bashCommands ?? [];
          const hasPR = cmds.some(c => c.includes('gh pr create') || c.includes('github-pr'));
          const hasPush = cmds.some(c => /\bgit\b.*\bpush\b/.test(c));
          if (!hasPR && !hasPush) return { pass: false, score: 0, reason: 'No PR creation or git push found (GIT_PR=true implies push)' };
          return { pass: true, score: 1, reason: hasPR ? 'PR creation found' : 'Git push found (PR may fail in eval workspace)' };
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertNoAskUser
      - type: javascript
        weight: 0
        value: file://../../shared/assertions/tool-calls.ts:assertTaskBuilderSpawned
      - type: javascript
        weight: 0
        value: file://../../shared/assertions/tool-calls.ts:assertArtifactRegistration
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertBuildProhibited
      - type: llm-rubric
        value: |
          Evaluate the agent execution with GIT_WORKTREE=true, GIT_PR=true, and AFK=true.

          REQUIRED (all must pass):
          1. Full workflow executes without user interaction (AFK mode)
          2. Task-builder creates commits with conventional format (feat:, fix:, etc.)
          3. Agent uses flag implication chain: GIT_PR sets GIT_PUSH=true and GIT_COMMIT=true
          4. Archives feature on successful completion

          PASS if: Full workflow, worktree isolation, commits, push, PR creation, no user prompts
          FAIL if: Missing workflow steps, user interaction in AFK mode, or no PR creation

# build Command Evaluation Suite
#
# Unified eval config for /rp1-dev:build across harnesses.
# Default: claude-with-tools. Override: EVAL_HARNESS=opencode
#
# Run: just eval-run rp1-dev/build
description: "rp1-dev:build unified evaluation"
evaluateOptions:
  maxConcurrency: 4
extensions:
  - file://../../shared/extension.ts:extensionHook
providers:
  - id: file://../../../providers/claude-with-tools.ts
    label: rp1-agentic-eval
    config:
      model: claude-haiku-4-5
      permission_mode: bypassPermissions
      allow_dangerously_skip_permissions: true
      ask_user_behavior: first_option
      max_turns: 200
      setting_sources:
        - project
        - local
        - user
      plugins:
        - type: local
          path: plugins/dev
        - type: local
          path: plugins/base
      tools:
        - Read
        - Write
        - Edit
        - Glob
        - Grep
        - Bash
        - Skill
prompts:
  - file://prompt.txt
defaultTest:
  options:
    provider:
      id: "anthropic:claude-haiku-4-5-20251001"
      config:
        temperature: 0
  vars:
    REQUEST: "add a simple yaml validator command without adding new deps"
    GIT_WORKTREE: false
    GIT_COMMIT: false
    GIT_PUSH: false
    GIT_PR: false
    AFK: true
tests:
  - description: "default_behavior_afk"
    threshold: 0.6
    assert:
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertArtifactDetectorFirst
      - type: javascript
        weight: 0
        value: file://../../shared/assertions/tool-calls.ts:assertTaskBuilderSpawned
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertWorkStatusUpdate
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertNoAskUser
      - type: javascript
        value: file://../../shared/assertions/tool-calls.ts:assertBuildProhibited
      - type: llm-rubric
        value: |
          Evaluate the agent's output text for behavioral correctness.

          REQUIRED (all must pass):
          1. Spawns build-artifact-detector agent to determine start_step (1-6)
          2. Executes workflow steps in order: Requirements -> Design -> Tasks -> Build -> Verify -> Archive
          3. For each step, spawns the appropriate agent(s) as defined in the progress table
          4. Outputs step status table using symbols: [ ]=PENDING, [~]=RUNNING, [x]=COMPLETED, [-]=SKIPPED, [!]=FAILED
          5. Creates feature artifacts in {RP1_WORK_ROOT}/features/{FEATURE_ID}/ directory
          6. After requirements step completes, pauses for user review with Continue/Revise/Stop options (when not AFK)
          7. After design step completes, pauses for user review with Continue/Revise/Stop options (when not AFK)
          8. After build step completes, pauses for user review with Continue/Add Task/Stop options (when not AFK)
          9. Builder-reviewer loop runs for each task unit with max 2 attempts before escalation
          10. Verification phase invokes code-checker, feature-verifier, and comment-cleaner in parallel
          11. Build-verify-aggregator determines overall_status (VERIFIED/FAILED) and ready_for_merge
          12. Final output includes Feature ID, step status table (1-6), and artifacts created
          13. Agent reports work status updates via Metadata bashCommands containing "rp1 agent-tools emit" with "--type status_change" and "--run-id" flags
          14. Agent registers produced artifacts via Metadata bashCommands containing "rp1 agent-tools work artifact" with "--project", "--feature", "--run-id", and "--path" flags pointing to files in {RP1_WORK_ROOT}/features/{FEATURE_ID}/

          PASS if: Full workflow executes with status tracking
          FAIL if: Steps skipped out of order or no status table

<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>rp1 Arcade</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family:
					Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
					"Segoe UI", sans-serif;
				background: #f7f8fb;
				color: #17202a;
			}

			* {
				box-sizing: border-box;
			}

			body {
				display: grid;
				min-height: 100vh;
				margin: 0;
				place-items: center;
				background:
					linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(247, 248, 251, 0.92)),
					#f7f8fb;
			}

			main {
				display: grid;
				width: min(560px, calc(100vw - 48px));
				gap: 18px;
				padding: 40px 0;
			}

			.status-row {
				display: flex;
				align-items: center;
				gap: 14px;
			}

			.indicator {
				width: 14px;
				height: 14px;
				border: 2px solid #1f7a8c;
				border-top-color: transparent;
				border-radius: 999px;
				animation: spin 850ms linear infinite;
			}

			body[data-status="failure"] .indicator {
				display: grid;
				place-items: center;
				width: 24px;
				height: 24px;
				border: 2px solid #b42318;
				animation: none;
			}

			body[data-status="failure"] .indicator::before,
			body[data-status="failure"] .indicator::after {
				grid-area: 1 / 1;
				width: 12px;
				height: 2px;
				content: "";
				background: #b42318;
			}

			body[data-status="failure"] .indicator::before {
				transform: rotate(45deg);
			}

			body[data-status="failure"] .indicator::after {
				transform: rotate(-45deg);
			}

			h1 {
				margin: 0;
				font-size: 28px;
				font-weight: 650;
				line-height: 1.2;
				letter-spacing: 0;
			}

			p {
				margin: 0;
				color: #4d5a66;
				font-size: 16px;
				line-height: 1.55;
			}

			.detail {
				overflow-wrap: anywhere;
				color: #243447;
				font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
				font-size: 13px;
				line-height: 1.55;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					background: #101418;
					color: #f2f5f7;
				}

				body {
					background:
						linear-gradient(180deg, rgba(20, 26, 32, 0.82), rgba(16, 20, 24, 0.96)),
						#101418;
				}

				p {
					color: #b8c3cc;
				}

				.detail {
					color: #d7e0e7;
				}
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}
		</style>
	</head>
	<body data-status="loading">
		<main>
			<div class="status-row">
				<div class="indicator" aria-hidden="true"></div>
				<h1 id="title">Opening rp1 Arcade</h1>
			</div>
			<p id="message">Preparing the native shell.</p>
			<p id="detail" class="detail" hidden></p>
		</main>
		<script>
			const injectedState =
				typeof window.__RP1_LAUNCH_STATE__ === "object" &&
				window.__RP1_LAUNCH_STATE__ !== null
					? window.__RP1_LAUNCH_STATE__
					: {};
			const params = new URLSearchParams(window.location.search);
			const status =
				injectedState.status === "failure" || params.get("status") === "failure"
					? "failure"
					: "loading";
			const title =
				injectedState.title || params.get("title") || "Opening rp1 Arcade";
			const message =
				injectedState.message ||
				params.get("message") ||
				"Preparing the native shell.";
			const detail = injectedState.detail || params.get("detail") || "";

			document.body.dataset.status = status;
			document.getElementById("title").textContent = title;
			document.getElementById("message").textContent = message;

			const detailElement = document.getElementById("detail");
			if (detail) {
				detailElement.textContent = detail;
				detailElement.hidden = false;
			}
		</script>
	</body>
</html>
